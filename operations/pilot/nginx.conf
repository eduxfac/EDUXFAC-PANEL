pid /run/nginx.pid;
error_log /var/log/nginx/eduxfac-error.log warn;
worker_processes auto;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 log_format eduxfac_safe '$time_iso8601 $request_method $uri $status $request_time';
 access_log /var/log/nginx/eduxfac-access.log eduxfac_safe;
 limit_req_zone $binary_remote_addr zone=pilot_login:10m rate=5r/s;
 limit_req_zone $binary_remote_addr zone=pilot_internal:10m rate=10r/s;
 limit_req_status 429;
 server { listen 80; server_name app.eduxfac.com admin.eduxfac.com; return 308 https://$host$request_uri; }
 server {
  listen 443 ssl; server_name app.eduxfac.com;
  ssl_certificate /etc/letsencrypt/live/app.eduxfac.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.eduxfac.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3; client_max_body_size 30m;
  proxy_set_header Host $http_host; proxy_connect_timeout 3s; proxy_read_timeout 30s; proxy_send_timeout 30s;
  location /api/internal/ { allow 127.0.0.1; allow ::1; deny all; client_max_body_size 16k; limit_req zone=pilot_internal burst=30 nodelay; proxy_pass http://127.0.0.1:3000; }
  location = /api/auth/login { client_max_body_size 16k; limit_req zone=pilot_login burst=20 nodelay; proxy_pass http://127.0.0.1:3000; }
  location / { proxy_pass http://127.0.0.1:3000; }
 }
 server {
  listen 443 ssl; server_name admin.eduxfac.com;
  ssl_certificate /etc/letsencrypt/live/admin.eduxfac.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.eduxfac.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3; client_max_body_size 32k;
  proxy_set_header Host $http_host; proxy_connect_timeout 3s; proxy_read_timeout 30s; proxy_send_timeout 30s;
  location = /api/login { client_max_body_size 16k; limit_req zone=pilot_login burst=20 nodelay; proxy_pass http://127.0.0.1:4310; }
  location / { proxy_pass http://127.0.0.1:4310; }
 }
}
